<!DOCTYPE html>
<html>

<head>

    <title>Login TMS PLN</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-page">

<div class="login-wrapper">

    <!-- KIRI -->

    <div class="login-banner">

    </div>

    <!-- KANAN -->

    <div class="login-form-side">

        <div class="login-box">

            <img src="{{ url_for('static',
            filename='img/logo_pln.png') }}"
            class="login-logo">

            <h2>Selamat Datang</h2>

            <p>
                Masuk untuk melanjutkan sistem
            </p>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                <label>Email / Username</label>

                <div class="input-box">

                    <span></span>

                    <input type="text"
                           name="username"
                           placeholder="Masukkan username"
                           required>

                </div>

                <label>Password</label>

                <div class="input-box">

                    <span></span>

                    <input type="password"
                           name="password"
                           placeholder="Masukkan password"
                           required>

                </div>

                <div class="forgot">

                    <a href="#">
                        Lupa password?
                    </a>

                </div>

                <button class="btn-login">

                    Masuk →

                </button>

            </form>

            <div class="register-text">

                Belum punya akun?

                <a href="/register">
                    Daftar Sekarang
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
